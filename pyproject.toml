[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yap-kit"
version = "0.1.0"
description = "An open-source, multi-provider text-to-speech CLI for AI agents. Everything they need to yap."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
yap = "yap_kit.cli:main"

[tool.setuptools.packages.find]
include = ["yap_kit*"]
