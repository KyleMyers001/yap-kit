[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yap-permit"
version = "0.1.0"
description = "Agent-friendly, multi-provider text-to-speech CLI with a fail-closed private mode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
yap = "yap_permit.cli:main"

[tool.setuptools.packages.find]
include = ["yap_permit*"]
